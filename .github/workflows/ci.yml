name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - security-and-production-hardening

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: blue_collar_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d blue_collar_ai_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/blue_collar_ai_test
      AI_INTEGRATIONS_OPENAI_API_KEY: test-key-not-used-for-network-calls
      AI_INTEGRATIONS_OPENAI_BASE_URL: https://example.invalid/v1
      OPENAI_API_KEY: test-key-not-used-for-network-calls

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Prepare test database schema
        run: pnpm --filter @workspace/db push-force

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run all workspace tests
        run: pnpm -r --if-present run test

      - name: Build production artifacts
        run: pnpm run build
